# Generates the README cards as static SVGs once a day and commits them, so the
# profile does not depend on the public github-readme-stats host and its rate limits.
# With the PAT_1 secret (classic token, scopes: repo, read:user) the cards count
# private repositories too; without it GITHUB_TOKEN gives public stats only.
name: Update README cards

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lhk0721&show_icons=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=lhk0721&layout=compact&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
