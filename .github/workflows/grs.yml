# Generates the README cards as static SVGs once a day and commits them, so the
# profile does not depend on the public github-readme-stats host and its rate limits.
# With the PAT_1 secret (classic token, scopes: repo, read:user) the cards count
# private repositories too; without it GITHUB_TOKEN gives public stats only.
name: Update README cards

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lhk0721&show_icons=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # Jupyter Notebook is hidden: notebooks carry their outputs, so by bytes they
          # dwarf every language (92% with the private study repos counted)
          options: username=lhk0721&layout=compact&hide_border=true&langs_count=8&hide=jupyter%20notebook
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}

      # The trophy project ships no card action with layout options, so its source is
      # checked out at a pinned commit and profile/render_trophy.ts draws the card.
      - name: Trophy card source
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          path: .trophy

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Trophy card
        env:
          GITHUB_TOKEN1: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
        run: |
          cp profile/render_trophy.ts .trophy/
          cd .trophy
          deno run --allow-net --allow-env --allow-read --allow-write render_trophy.ts lhk0721 ../profile/trophy.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
